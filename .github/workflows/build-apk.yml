name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK is pre-installed on GitHub's Ubuntu runners - just accept licenses
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MegsConsultation.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegsConsultation-apk
          path: MegsConsultation.apk

      - name: Publish to "latest" release (shareable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Megs Consultation - latest build
          files: MegsConsultation.apk
